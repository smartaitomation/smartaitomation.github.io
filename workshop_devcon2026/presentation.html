<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Evals workshop · Presentation</title><style>*{box-sizing:border-box}body{font:15px/1.5 -apple-system,Arial,sans-serif;background:#f2f4f5;color:#17242b;margin:0}header{padding:18px 22px;position:sticky;top:0;background:#fff;z-index:2;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd}a{color:#3159ce}main{max-width:1250px;margin:auto;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;scroll-margin-top:110px}img{width:100%;box-shadow:0 3px 18px #0001}figcaption{padding:8px 0;color:#657780}.slide-download{display:block;font-size:18px;font-weight:650;overflow-wrap:anywhere;margin-top:8px}select{padding:8px;max-width:100%}@media(max-width:750px){main{grid-template-columns:1fr;padding:14px}header{position:static;gap:12px}}</style></head><body><header><a href="./#intro">← Workshop</a><strong>AI evaluations</strong><a href="downloads/recruiting-email-evals.pptx">Editable PowerPoint ↓</a><a href="downloads/recruiting-email-evals.pdf">PDF ↓</a><a href="./#synthetic">Synthetic examples prompt</a><select id="jump" aria-label="Jump to slide"></select></header><main id="slides"></main><script>fetch('slides.json',{cache:'no-store'}).then(r=>r.json()).then(ss=>{document.querySelector('#jump').innerHTML='<option value="">Jump to a slide</option>'+ss.map(s=>`<option value="s${s.number}">${s.number}. ${s.title}</option>`).join('');document.querySelector('#slides').innerHTML=ss.map(s=>`<figure id="s${s.number}"><img loading="lazy" src="presentation-assets/page-${String(s.number).padStart(2,'0')}.png?v=prompt-qr-v12" alt="${s.title.replaceAll('"','&quot;')}"><figcaption>${s.number}. ${s.title}${s.prompt_key?`<a class="slide-download" href="https://smartaitomation.com/workshop_devcon2026/p/${s.prompt_key}.txt" download>Download prompt: smartaitomation.com/workshop_devcon2026/p/${s.prompt_key}.txt</a>`:''}</figcaption></figure>`).join('');document.querySelector('#jump').onchange=e=>document.getElementById(e.target.value)?.scrollIntoView({behavior:'smooth',block:'center'});if(location.hash)document.querySelector(location.hash)?.scrollIntoView()})</script></body></html>
