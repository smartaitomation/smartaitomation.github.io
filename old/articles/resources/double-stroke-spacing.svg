<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title desc"><title id="title">Four intended strokes per click</title><desc id="desc">R1 R2 L1 L2 are equally spaced inside one click interval. Next R1 falls at the next click. This is a schematic, not measured audio.</desc><rect width="600" height="260" rx="18" fill="#f0f3eb"/><g fill="#173f35" font-family="system-ui,sans-serif" font-size="24"><text x="30" y="40">Quarter-note click → 4 strokes</text><text x="35" y="105">R1</text><text x="145" y="105">R2</text><text x="255" y="105">L1</text><text x="365" y="105">L2</text><text x="475" y="105">R1</text><text x="25" y="215">Click</text><text x="460" y="215">Next click</text></g><path d="M55 140H495M55 125V165M165 130V150M275 130V150M385 130V150M495 125V165" fill="none" stroke="#173f35" stroke-width="4"/><g fill="#173f35"><circle cx="55" cy="140" r="7"/><circle cx="165" cy="140" r="7"/><circle cx="275" cy="140" r="7"/><circle cx="385" cy="140" r="7"/><circle cx="495" cy="140" r="7"/></g><text x="30" y="245" font-family="system-ui,sans-serif" font-size="18" fill="#173f35">Intended timing only • no audio measurement</text></svg>