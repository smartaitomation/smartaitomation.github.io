<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="t d"><title id="t">Practice across section boundaries</title><desc id="d">A four bars, B four bars, C two bars. Practice windows cross A to B and B to C.</desc><rect width="600" height="250" rx="16" fill="#f0f3eb"/><g font-family="system-ui,sans-serif" font-size="24" fill="#173f35"><text x="24" y="40">Original section map</text><rect x="25" y="65" width="210" height="65" rx="8" fill="#d6e6dd"/><rect x="245" y="65" width="210" height="65" rx="8" fill="#d6e6dd"/><rect x="465" y="65" width="110" height="65" rx="8" fill="#d6e6dd"/><text x="65" y="106">A · 4 bars</text><text x="285" y="106">B · 4 bars</text><text x="477" y="106">C · 2</text><path d="M180 145v18h120v-18M400 145v18h120v-18" fill="none" stroke="#173f35" stroke-width="3"/><text x="160" y="200">A → B</text><text x="400" y="200">B → C</text><text x="24" y="234" font-size="18">Keep the approach and entrance together.</text></g></svg>