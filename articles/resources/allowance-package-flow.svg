<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300"><rect width="600" height="300" rx="18" fill="#eff2eb"/><g font-family="sans-serif" fill="#203e34"><text x="22" y="40" font-size="28">Example: chosen addition, then packages</text><rect x="20" y="65" width="170" height="130" rx="12" fill="#d6e5df"/><rect x="215" y="65" width="170" height="130" rx="12" fill="#e6dfcd"/><rect x="410" y="65" width="170" height="130" rx="12" fill="#d6e5df"/><text x="40" y="105" font-size="24">Base</text><text x="40" y="152" font-size="34">12 m²</text><text x="233" y="105" font-size="24">Add 10%</text><text x="233" y="152" font-size="34">13.2 m²</text><text x="428" y="105" font-size="24">÷1.6 m²</text><text x="428" y="152" font-size="34">8.25</text><text x="22" y="239" font-size="27">Round up: 9 packages = 14.4 m².</text><text x="22" y="278" font-size="24">Illustrative 10%, not a recommendation.</text></g></svg>