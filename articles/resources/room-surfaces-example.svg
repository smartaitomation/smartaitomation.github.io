<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-labelledby="title desc"><title id="title">Floor and wall areas are different</title><desc id="desc">Fictional rectangular floor 12 by 10 feet: 120 square feet. Assumed wall height 8 feet gives a 44-foot perimeter and 352 square feet of gross walls. Not a surveyed plan.</desc><rect width="600" height="390" rx="18" fill="#f2f1e8"/><rect x="130" y="58" width="324" height="270" fill="#d6e9dc" stroke="#173f35" stroke-width="5"/><path d="M130 40h324 M113 58v270" stroke="#173f35" stroke-width="2"/><g fill="#173f35" font-family="system-ui,sans-serif" font-size="24"><text x="292" y="30" text-anchor="middle">12 ft</text><text x="472" y="200">10 ft</text><text x="292" y="183" text-anchor="middle">Floor: 120 sq ft</text><text x="292" y="220" text-anchor="middle">Walls: separate scope</text><text x="300" y="369" text-anchor="middle">Assumed height 8 ft → gross walls 352 sq ft</text></g></svg>
