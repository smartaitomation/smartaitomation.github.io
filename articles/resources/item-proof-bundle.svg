<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">One item, three linked evidence references</title><desc id="desc">Inventory item CN-001 links to an overview photo, a serial-label image and receipt R-07 line 2. Verify each source separately.</desc><rect width="600" height="330" rx="18" fill="#f2f1e8"/><g font-family="system-ui,sans-serif" font-size="25" fill="#173f35"><rect x="32" y="25" width="536" height="60" rx="10" fill="#d6e9dc" stroke="#173f35"/><text x="300" y="64" text-anchor="middle">Internal item ID: CN-001</text><path d="M300 85v25 M300 110H60v170" stroke="#173f35" fill="none" stroke-width="3"/><text x="90" y="148">1. Overview photo → physical item</text><text x="90" y="215">2. Label photo → readable serial</text><text x="90" y="282">3. Receipt R-07 → relevant line 2</text></g></svg>
