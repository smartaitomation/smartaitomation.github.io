<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Job Posting Evals · Presentation</title><style>*{box-sizing:border-box}body{margin:0;background:#10181d;color:#fff;font:14px Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:16px 25px;gap:12px;border-bottom:1px solid #33414b}a{color:#b9cdfb;text-decoration:none}.actions{display:flex;gap:18px}.stage{height:calc(100vh - 125px);display:flex;align-items:center;justify-content:center;padding:20px}#slide{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 50px #0005}footer{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px}button{padding:9px 15px;border:1px solid #576470;background:transparent;color:white;border-radius:6px;cursor:pointer}button:disabled{opacity:.3}select{max-width:450px;background:#24313b;color:white;padding:9px;border:1px solid #576470;border-radius:6px}@media(max-width:600px){header{padding:12px;font-size:11px;flex-wrap:wrap}.actions{gap:12px}.stage{padding:8px;height:calc(100vh - 145px)}footer{gap:8px;padding:10px}select{max-width:190px;font-size:11px}button{padding:9px;font-size:12px}}</style></head><body><header><a href="./">← Workshop workspace</a><div class="actions"><a href="downloads/job-posting-evals.pdf?v=20261111-relevance-replacements" download>PDF ↓</a><a href="downloads/job-posting-evals.pptx?v=20261111-relevance-replacements" download>Editable PPTX ↓</a><button id="full">Fullscreen</button></div></header><div class="stage"><img id="slide" alt="Workshop slide"></div><footer><button id="prev">←</button><select id="pick" aria-label="Choose slide"></select><button id="next">→</button></footer><script>const REV='20261111-relevance-replacements';let slides=[],i=0;const $=s=>document.querySelector(s);function show(n){i=Math.max(0,Math.min(slides.length-1,n));$('#slide').src='presentation-assets/page-'+String(i+1).padStart(2,'0')+'.png?v='+REV;$('#slide').alt=(i+1)+'. '+slides[i].title;$('#pick').value=i;$('#prev').disabled=!i;$('#next').disabled=i===slides.length-1;history.replaceState(null,'','#slide-'+(i+1))}fetch('slides.json?v='+REV).then(r=>r.json()).then(data=>{slides=data;for(let n=0;n<data.length;n++){const o=document.createElement('option');o.value=n;o.textContent=(n+1)+' / '+data.length+' · '+data[n].title;$('#pick').append(o)}show((parseInt(location.hash.replace('#slide-',''))||1)-1)});$('#prev').onclick=()=>show(i-1);$('#next').onclick=()=>show(i+1);$('#pick').onchange=e=>show(+e.target.value);$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(i+1)}if(e.key==='ArrowLeft')show(i-1)});</script></body></html>
