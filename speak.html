const $=id=>document.getElementById(id);let lang=0,topic=0,phase='idle',stream,recorder,timer,chunks=[],url,deadline,session=0;
const t=n=>texts[lang][n];
function word(){return bank[+$('category').value].words[topic][lang]}
function render(){document.documentElement.lang=['ro','ru','en'][lang];['level','heading','intro','catlabel','topiclabel','shuffle','start','stop'].forEach((id,i)=>$(id).textContent=t(i));$('resulttitle').textContent=t(11);$('download').textContent=t(12);$('banktitle').textContent=t(13);$('privacy').textContent=t(14);let selected=$('category').value||'0';$('category').replaceChildren(...bank.map((c,i)=>new Option(c.names[lang],i)));$('category').value=selected;$('word').textContent=word();$('list').replaceChildren(...bank.map(c=>{let p=document.createElement('p');let b=document.createElement('strong');b.textContent=c.names[lang]+': ';p.append(b,document.createTextNode(c.words.map(w=>w[lang]).join(' · ')));return p}));$('status').textContent=t(19)}
function pick(){const size=bank[+$('category').value].words.length;let old=topic;do{topic=Math.floor(Math.random()*size)}while(topic===old);$('word').textContent=word()}
function lock(v){['language','category','shuffle','start'].forEach(id=>$(id).disabled=v);$('stop').disabled=!v}
function release(){stream?.getTracks().forEach(t=>t.stop());stream=null}
function tick(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('progress').value=$('progress').max-left;if(!left){if(phase==='prepare'){try{recorder.start(250);phase='record';deadline=Date.now()+60000;$('progress').max=60;$('progress').value=0;$('clock').textContent='01:00';$('status').textContent=t(9)}catch(e){$('error').textContent=t(15);finish()}}else finish()}}
function finish(){clearInterval(timer);session++;const wasRecording=recorder?.state==='recording';phase='idle';if(wasRecording)recorder.stop();else{release();lock(false)}$('status').textContent=t(wasRecording?10:18)}
$('start').onclick=async()=>{const run=++session;lock(true);$('error').textContent='';$('status').textContent=t(17);try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('unsupported');const acquired=await navigator.mediaDevices.getUserMedia({audio:true});if(run!==session){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;chunks=[];const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported(m));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});const title=word(),language=['ro','ru','en'][lang];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{release();lock(false);if(!chunks.length){$('error').textContent=t(15);return}if(url)URL.revokeObjectURL(url);const type=recorder.mimeType||chunks[0].type;url=URL.createObjectURL(new Blob(chunks,{type}));$('audio').src=url;$('download').href=url;$('download').download='speak-'+language+'-'+title+'-'+new Date().toISOString().replace(/[:.]/g,'-')+(type.includes('mp4')?'.m4a':type.includes('ogg')?'.ogg':'.webm');$('result').hidden=false};recorder.onerror=()=>{$('error').textContent=t(15);finish()};phase='prepare';deadline=Date.now()+30000;$('progress').max=30;$('progress').value=0;$('clock').textContent='00:30';$('status').textContent=t(8);timer=setInterval(tick,200);$('result').hidden=true}catch(e){release();phase='idle';lock(false);$('error').textContent=t(15);$('status').textContent=''}};
